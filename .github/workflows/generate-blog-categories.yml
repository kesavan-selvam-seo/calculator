name: Generate blog categories

on:
  push:
    branches:
      - main
    paths:
      - 'blog/**/*.html'
      - 'generate_blog_categories.py'
      - '.github/workflows/generate-blog-categories.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate category pages
        run: python3 generate_blog_categories.py

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/*/index.html
          if git diff --cached --quiet; then
            echo "No category changes."
            exit 0
          fi
          git commit -m "chore: update blog category pages"
          git push
