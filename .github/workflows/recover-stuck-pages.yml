name: Recover blocked GitHub Pages deployment (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-stuck-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: recover-pages-stale-deployment
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check blocking Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deployment="02e9caedfcb9e937cd1d2a93a0e49bb98860d5a4"
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/$deployment"
          curl --fail-with-body -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$endpoint" > "$RUNNER_TEMP/pages-deployment.json"
          python3 - "$RUNNER_TEMP/pages-deployment.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          status=data.get("status")
          print("Blocking GitHub Pages deployment status:", status)
          if status not in ("deployment_in_progress","in_progress","queued","pending"):
              raise SystemExit("Refusing to cancel a deployment that is not explicitly pending or in progress.")
          PY

      - name: Cancel the stuck deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deployment="02e9caedfcb9e937cd1d2a93a0e49bb98860d5a4"
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/$deployment/cancel"
          status=$(curl -sS -L -o "$RUNNER_TEMP/cancel.json" -w "%{http_code}" \
            -X POST -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Authorization: Bearer $GH_TOKEN" "$endpoint")
          echo "Cancel response HTTP $status"
          if [ "$status" != "204" ]; then
            cat "$RUNNER_TEMP/cancel.json"
            exit 1
          fi

      - name: Request latest Pages build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
          status=$(curl -sS -L -o "$RUNNER_TEMP/build.json" -w "%{http_code}" \
            -X POST -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Authorization: Bearer $GH_TOKEN" "$endpoint")
          echo "Fresh Pages build request HTTP $status"
          cat "$RUNNER_TEMP/build.json"
          test "$status" = "201"
