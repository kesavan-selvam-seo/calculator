name: Publish CMS Posts

on:
  push:
    branches:
      - main
    paths:
      - 'content/posts/**/*.md'
      - 'publish_cms_posts.py'
      - '.github/workflows/publish-cms-posts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate blog HTML pages from CMS posts
        run: python3 publish_cms_posts.py

      - name: Commit generated blog pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/*/index.html
          if git diff --cached --quiet; then
            echo "No blog page changes."
            exit 0
          fi
          git commit -m "chore: publish CMS blog posts"
          git push
