name: Update sitemap

on:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - '**/*.xml'
      - '**/*.md'
      - 'generate_sitemap.py'
      - '.github/workflows/update-sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Generate sitemap
        run: python3 generate_sitemap.py

      - name: Commit sitemap changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- sitemap.xml; then
            echo "No sitemap changes."
            exit 0
          fi
          git add sitemap.xml
          git commit -m "chore: update sitemap"
          git push
