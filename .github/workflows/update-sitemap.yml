name: Update sitemap

on:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - '**/*.xml'
      - '**/*.md'
      - 'generate_sitemap.py'
      - 'generate_blog_archive.py'
      - 'normalize_calculator_canonicals.py'
      - '.github/workflows/update-sitemap.yml'
      - 'data/calculator-categories.json'
      - 'sync_calculator_availability.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync category availability
        run: |
          python3 sync_calculator_availability.py
          python3 sync_calculator_availability.py --check

      - name: Normalize calculator canonical URLs
        run: python3 normalize_calculator_canonicals.py

      - name: Refresh blog landing page article archive
        run: python3 generate_blog_archive.py

      - name: Generate canonical-only sitemap
        run: python3 generate_sitemap.py

      - name: Commit canonical and sitemap changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calculators categories/astrology-numerology/index.html sitemap.xml blog/index.html
          if git diff --cached --quiet; then
            echo "No canonical or sitemap changes."
            exit 0
          fi
          git commit -m "fix: normalize calculator URLs and sitemap"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            sleep 2
          done
          exit 1
