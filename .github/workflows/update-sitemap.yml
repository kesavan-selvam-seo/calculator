name: Update sitemap

on:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - '**/*.xml'
      - '**/*.md'
      - 'generate_sitemap.py'
      - 'normalize_calculator_canonicals.py'
      - '.github/workflows/update-sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Normalize calculator canonical URLs
        run: python3 normalize_calculator_canonicals.py

      - name: Generate canonical-only sitemap
        run: python3 generate_sitemap.py

      - name: Commit canonical and sitemap changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calculators sitemap.xml
          if git diff --cached --quiet; then
            echo "No canonical or sitemap changes."
            exit 0
          fi
          git commit -m "fix: normalize calculator URLs and sitemap"
          git push
